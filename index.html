  <style>
    /* ==========================================================
       TOKENS
       Concept: a proofing bench. The page is the paper desk, the
       stage is a dark bench the specimen is laid on, and the
       vermilion offset frame is the proofreader's mark.
       Palette: cool grey desk, ink text, one vermilion accent.
       ========================================================== */
    :root {
      color-scheme: light;

      --bg: #E8EBF0;
      --panel: #F6F7F9;
      --panel-2: #FFFFFF;
      --ink: #10131A;
      --ink-2: #566072;
      --line: #D3D9E2;
      --accent: #FF5A2C;
      --accent-ink: #10131A;

      --bench: #151922;
      --bench-dot: rgba(255, 255, 255, 0.09);
      --grain-opacity: 0.07;

      --r-s: 10px;
      --r-m: 20px;
      --r-l: 32px;

      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 24px;
      --sp-6: 32px;

      --shadow-panel: 0 1px 2px rgba(16, 19, 26, 0.05), 0 6px 16px rgba(16, 19, 26, 0.06), 0 24px 48px rgba(16, 19, 26, 0.08);
      --shadow-float: 0 1px 2px rgba(16, 19, 26, 0.1), 0 8px 20px rgba(16, 19, 26, 0.14);
      --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0B0E13;
        --panel: #141922;
        --panel-2: #1C222C;
        --ink: #EDF0F5;
        --ink-2: #97A1B2;
        --line: #2A313C;
        --accent: #FF6B3F;
        --bench: #07090D;
        --bench-dot: rgba(255, 255, 255, 0.07);
        --grain-opacity: 0.09;
        --shadow-panel: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 20px rgba(0, 0, 0, 0.35), 0 28px 56px rgba(0, 0, 0, 0.4);
        --shadow-float: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 20px rgba(0, 0, 0, 0.5);
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0B0E13;
      --panel: #141922;
      --panel-2: #1C222C;
      --ink: #EDF0F5;
      --ink-2: #97A1B2;
      --line: #2A313C;
      --accent: #FF6B3F;
      --bench: #07090D;
      --bench-dot: rgba(255, 255, 255, 0.07);
      --grain-opacity: 0.09;
      --shadow-panel: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 20px rgba(0, 0, 0, 0.35), 0 28px 56px rgba(0, 0, 0, 0.4);
      --shadow-float: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    /* ==========================================================
       BASE
       ========================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app {
      max-width: 1360px;
      margin: 0 auto;
      padding: var(--sp-4) var(--sp-5) var(--sp-6);
    }

    /* ==========================================================
       TOP BAR
       ========================================================== */
    .top {
      display: flex;
      align-items: center;
      gap: var(--sp-5);
      flex-wrap: wrap;
      padding-bottom: var(--sp-4);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-3);
      color: inherit;
      text-decoration: none;
    }

    .mark {
      position: relative;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: var(--ink);
      flex: none;
    }

    .mark::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translate(4px, 4px);
      border: 2px solid var(--accent);
      border-radius: 7px;
      z-index: -1;
    }

    .brand-name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .brand-by {
      color: var(--ink-2);
      font-size: 14px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      margin-left: auto;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }

    .tab {
      border: 0;
      border-radius: var(--r-s);
      background: transparent;
      padding: 7px 14px;
      color: var(--ink-2);
      font-weight: 500;
      font-size: 14px;
      line-height: 1.2;
    }

    .tab:hover {
      color: var(--ink);
    }

    .tab[aria-current="true"] {
      background: var(--ink);
      color: var(--bg);
    }

    .tab[aria-current="true"]::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: 1px;
    }

    .tab:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .tab small {
      margin-left: 6px;
      font-size: 12px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--r-s);
    }

    .icon-btn:hover {
      border-color: var(--ink-2);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
    }

    .intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--sp-3) var(--sp-5);
      padding: var(--sp-5) 0 var(--sp-5);
    }

    .intro h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(28px, 3.4vw, 40px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .intro p {
      margin: 0;
      max-width: 42ch;
      color: var(--ink-2);
      font-size: 15px;
    }

    /* ==========================================================
       WORK AREA
       ========================================================== */
    .work {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: var(--sp-6);
      align-items: start;
    }

    .panel {
      position: sticky;
      top: var(--sp-4);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r-m);
      box-shadow: var(--shadow-panel);
    }

    .panel-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-4) var(--sp-5);
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .link-btn {
      border: 0;
      background: none;
      padding: 4px 0;
      color: var(--ink-2);
      font-size: 14px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .link-btn:hover {
      color: var(--ink);
    }

    .sec {
      border-bottom: 1px solid var(--line);
    }

    .sec:last-child {
      border-bottom: 0;
    }

    .sec summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-4) var(--sp-5);
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--ink-2);
    }

    .sec[open] > summary {
      color: var(--ink);
      padding-bottom: var(--sp-3);
    }

    .sec summary::-webkit-details-marker {
      display: none;
    }

    .sec summary::after {
      content: "";
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--ink-2);
      border-bottom: 2px solid var(--ink-2);
      transform: rotate(45deg);
      transition: transform 0.15s ease;
      margin-right: 4px;
    }

    .sec[open] summary::after {
      transform: rotate(-135deg);
    }

    .sec-body {
      display: grid;
      gap: var(--sp-4);
      padding: 0 var(--sp-5) var(--sp-5);
    }

    .field[hidden] {
      display: none;
    }

    .field > .lbl,
    .field > label.lbl {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
      margin-bottom: 6px;
    }

    .field input[type="text"],
    .field input[type="number"],
    .field textarea {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: var(--r-s);
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.4;
      box-shadow: inset 0 1px 2px rgba(16, 19, 26, 0.05);
    }

    .field textarea {
      resize: vertical;
      min-height: 96px;
    }

    .field input:focus,
    .field textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 0;
      border-color: transparent;
    }

    .seg {
      display: flex;
      border: 1px solid var(--line);
      border-radius: var(--r-s);
      background: var(--panel-2);
      padding: 3px;
      gap: 3px;
    }

    .seg button {
      flex: 1;
      border: 0;
      background: transparent;
      border-radius: 7px;
      padding: 7px 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
      white-space: nowrap;
    }

    .seg button:hover {
      color: var(--ink);
    }

    .seg button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
      box-shadow: 0 1px 2px rgba(16, 19, 26, 0.25);
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
      cursor: pointer;
      font-size: 14px;
    }

    .switch-row input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .switch {
      position: relative;
      width: 38px;
      height: 22px;
      flex: none;
      border-radius: 11px;
      background: var(--line);
      transition: background 0.15s ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease;
    }

    .switch-row input:checked + .switch {
      background: var(--accent);
    }

    .switch-row input:checked + .switch::after {
      transform: translateX(16px);
    }

    .switch-row input:focus-visible + .switch {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-row {
      display: flex;
      gap: var(--sp-2);
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: var(--r-s);
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 500;
    }

    .btn:hover {
      border-color: var(--ink-2);
    }

    .btn--primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
    }

    .btn--primary:hover {
      filter: brightness(1.05);
      border-color: var(--accent);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: progress;
    }

    .img-field {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
    }

    .img-thumb {
      width: 52px;
      height: 52px;
      flex: none;
      border-radius: var(--r-s);
      border: 1px solid var(--line);
      background: var(--panel-2) center / cover no-repeat;
    }

    .rx-picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--sp-2);
    }

    .rx-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: var(--r-s);
      padding: 6px 8px;
      font-size: 13px;
      color: var(--ink-2);
    }

    .rx-chip svg {
      width: 20px;
      height: 20px;
      flex: none;
      opacity: 0.45;
      filter: grayscale(1);
    }

    .rx-chip[aria-pressed="true"] {
      border-color: var(--ink);
      color: var(--ink);
    }

    .rx-chip[aria-pressed="true"] svg {
      opacity: 1;
      filter: none;
    }

    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-2);
    }

    .sw {
      width: 34px;
      height: 34px;
      border-radius: var(--r-s);
      border: 1px solid var(--line);
      padding: 0;
      background-size: cover;
    }

    .sw[aria-pressed="true"] {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .sw--none {
      background:
        linear-gradient(45deg, #b9c0cc 25%, transparent 25%, transparent 75%, #b9c0cc 75%),
        linear-gradient(45deg, #b9c0cc 25%, #fff 25%, #fff 75%, #b9c0cc 75%);
      background-size: 10px 10px;
      background-position: 0 0, 5px 5px;
    }

    .sw--custom {
      position: relative;
      overflow: hidden;
      background: conic-gradient(#f43, #fc3, #3c9, #39f, #93f, #f43);
    }

    .sw--custom input {
      position: absolute;
      inset: -6px;
      width: 60px;
      height: 60px;
      opacity: 0;
      cursor: pointer;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    /* ==========================================================
       STAGE
       Signature: a dark bench with an offset vermilion frame behind
       it. The toolbar and the two chips float across its top and
       bottom edges.
       ========================================================== */
    .stage-col {
      min-width: 0;
    }

    .bar {
      position: relative;
      z-index: 4;
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: var(--sp-2);
      margin: 0 28px -20px 0;
    }

    .bar .btn {
      height: 40px;
      padding: 0 18px;
      box-shadow: var(--shadow-float);
    }

    .stage-wrap {
      position: relative;
      margin: 0 12px 12px 0;
    }

    .stage-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      transform: translate(12px, 12px);
      border: 2px solid var(--accent);
      border-radius: var(--r-l);
    }

    .stage {
      position: relative;
      display: flex;
      justify-content: center;
      min-height: 560px;
      padding: var(--sp-6);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--r-l);
      background-color: var(--bench);
      background-image: radial-gradient(var(--bench-dot) 1px, transparent 1.4px);
      background-size: 18px 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), inset 0 -60px 90px rgba(0, 0, 0, 0.25);
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: var(--grain-opacity);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    .chip {
      position: absolute;
      z-index: 3;
      background: var(--panel-2);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--r-s);
      box-shadow: var(--shadow-float);
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
    }

    .chip--top {
      top: -14px;
      left: 24px;
    }

    .chip--bottom {
      bottom: -14px;
      right: 24px;
    }

    #fit {
      position: relative;
      z-index: 1;
      flex: none;
      align-self: flex-start;
    }

    #scaler {
      width: max-content;
      transform-origin: 0 0;
    }

    #frame {
      width: max-content;
      display: block;
    }

    #card {
      width: max-content;
    }

    #card.settle {
      animation: settle 0.38s cubic-bezier(0.2, 0.7, 0.1, 1) both;
    }

    @keyframes settle {
      from {
        opacity: 0;
        transform: translateY(-14px) scale(1.012);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 16px);
      background: var(--ink);
      color: var(--bg);
      padding: 10px 16px;
      border-radius: var(--r-s);
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 20;
    }

    .toast.on {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 960px) {
      .bar {
        margin: 0 0 var(--sp-4);
      }

      .intro {
        padding: var(--sp-4) 0;
      }
    }

    /* ==========================================================
       LINKEDIN POST (platform-accurate: system fonts, LinkedIn tokens)
       ========================================================== */
    .lk {
      --lk-bg: #ffffff;
      --lk-text: rgba(0, 0, 0, 0.9);
      --lk-sub: rgba(0, 0, 0, 0.6);
      --lk-line: #e0dfdc;
      --lk-blue: #0a66c2;
      --lk-ring: rgba(0, 0, 0, 0.08);

      width: var(--card-w);
      background: var(--lk-bg);
      color: var(--lk-text);
      border-radius: var(--lk-r, 8px);
      overflow: hidden;
      text-align: left;
      font: 400 14px/20px -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", "Fira Sans", Ubuntu, Oxygen, "Oxygen Sans", Cantarell, "Droid Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Lucida Grande", Helvetica, Arial, sans-serif;
      box-shadow: 0 0 0 1px var(--lk-ring), 0 2px 4px rgba(10, 14, 25, 0.08), 0 14px 36px rgba(10, 14, 25, 0.16);
    }

    .lk--dark {
      --lk-bg: #1b1f23;
      --lk-text: rgba(255, 255, 255, 0.9);

      border-bottom: 1px solid var(--yt-line);
    }

    /* ==========================================================
       RESPONSIVE (continued)
       ========================================================== */
    @media (max-width: 960px) {
      .app {
        padding: var(--sp-3) var(--sp-4) var(--sp-5);
      }

      .tabs {
        margin-left: 0;
        order: 3;
        width: 100%;
      }

      .top .icon-btn {
        margin-left: auto;
      }

      .work {
        grid-template-columns: minmax(0, 1fr);
        gap: var(--sp-5);
      }

      .stage-col {
        order: -1;
      }

      .panel {
        position: static;
        max-height: none;
      }

      .stage {
        padding: var(--sp-4);

      }

      }

      }

      .switch::after,
      .sec summary::after {

      }

</head>
<body>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    (function () {
      'use strict';

      /* ======================================================
         HELPERS
         ====================================================== */
      var $ = function (sel, root) { return (root || document).querySelector(sel); };

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function fmt(n) {
        return new Intl.NumberFormat('en-US').format(Math.max(0, Math.floor(Number(n) || 0)));
      }

      function clampInt(v) {
        var n = parseInt(v, 10);
        return isNaN(n) || n < 0 ? 0 : n;
      }

      function h(tag, props) {
        var e = document.createElement(tag);
        var p = props || {};
        Object.keys(p).forEach(function (k) {
          var v = p[k];
          if (k === 'class') e.className = v;
          else if (k === 'text') e.textContent = v;
          else if (k === 'html') e.innerHTML = v;
          else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
          else if (v === true) e.setAttribute(k, '');
          else if (v !== false && v != null) e.setAttribute(k, v);
        });
        for (var i = 2; i < arguments.length; i++) {
          var kids = [].concat(arguments[i]);
          for (var j = 0; j < kids.length; j++) {
            var c = kids[j];
            if (c == null) continue;
            e.append(c.nodeType ? c : document.createTextNode(c));
          }
        }
        return e;
      }

      function dataSvg(svg) {
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      }

      function toast(msg) {
        var t = $('#toast');
        t.textContent = msg;
        t.classList.add('on');
        clearTimeout(toast._t);
        toast._t = setTimeout(function () { t.classList.remove('on'); }, 2200);
      }

      /* ======================================================
         IMAGE HELPERS
         ====================================================== */
      function readImage(file, opts) {
        if (file.type.indexOf('video/') === 0) return readVideoFrame(file, opts);
        return readImageOnly(file, opts);
      }

      function readImageOnly(file, opts) {
        return new Promise(function (resolve, reject) {
          var url = URL.createObjectURL(file);
          var img = new Image();
          img.onload = function () {
            var sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight, dw, dh;
            if (opts.square) {
              var m = Math.min(sw, sh);
              sx = (sw - m) / 2;
              sy = (sh - m) / 2;
              sw = sh = m;
              dw = dh = Math.min(opts.max, m);
            } else {
              var k = Math.min(1, opts.max / sw);
              dw = Math.round(sw * k);
              dh = Math.round(sh * k);
            }
            var c = document.createElement('canvas');
            c.width = dw;
            c.height = dh;
            c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, dw, dh);
            URL.revokeObjectURL(url);
            var keepAlpha = /png|webp|gif|svg/.test(file.type);
            resolve(c.toDataURL(keepAlpha ? 'image/png' : 'image/jpeg', 0.9));
          };
          img.onerror = function () {
            URL.revokeObjectURL(url);
            reject(new Error('That file could not be read as an image.'));
          };
          img.src = url;
        });

      function initials(name) {

      var ICON = {

        love: { label: 'Love', bg: '#df704d', glyph: '<path d="' + HEART + '"/>' },

        );

      /* LinkedIn cuts feed text at about 3 lines or 210 characters */

        if (lines.length > 3) {

          cut = true;
        }
        var out = lines.join('\n');
        if (out.length > 210) {
          out = out.slice(0, 210);
          var sp = out.lastIndexOf(' ');
          if (sp > 120) out = out.slice(0, sp);
          cut = true;

        return { text: out.replace(/\s+$/, ''), cut: cut };

      /* Real video files: grab a frame and keep the video look */
      function readVideoFrame(file, opts) {
        return new Promise(function (resolve, reject) {
          var url = URL.createObjectURL(file);
          var v = document.createElement('video');
          var done = false;
          var timer;
          var fail = function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            URL.revokeObjectURL(url);
            reject(new Error('That video could not be read. Try an MP4 (H.264) file.'));
          };
          timer = setTimeout(fail, 12000);
          v.muted = true;
          v.preload = 'auto';
          v.setAttribute('playsinline', '');
          v.addEventListener('error', fail);
          v.addEventListener('loadedmetadata', function () {
            var dur = v.duration;
            if (isFinite(dur) && !opts.square) VIDEO.len = clock(dur);
            v.currentTime = isFinite(dur) ? Math.min(1, dur / 2) : 0;
          });
          v.addEventListener('seeked', function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            var sx = 0, sy = 0, sw = v.videoWidth, sh = v.videoHeight, dw, dh;
            if (opts.square) {
              var m = Math.min(sw, sh);
              sx = (sw - m) / 2;
              sy = (sh - m) / 2;
              sw = sh = m;
              dw = dh = Math.min(opts.max, m);
            } else {
              var k = Math.min(1, opts.max / sw);
              dw = Math.round(sw * k);
              dh = Math.round(sh * k);
            }
            var c = document.createElement('canvas');
            c.width = dw;
            c.height = dh;
            c.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, dw, dh);
            URL.revokeObjectURL(url);
            resolve(c.toDataURL('image/jpeg', 0.9) + (opts.square ? '' : '#v'));
          });
          v.src = url;
        });
      }

            ? '<div class="yt-cm"><img class="yt-av" src="' + esc(initialsAvatar(user || 'User')) + '" alt="">' +
              '<div><div class="yt-cmu"><b>@' + esc(user) + '</b> <span>' + esc(s.commentAge) + '</span></div>' +
              '<div>' + esc(s.commentText) + '</div>' +
              '<div class="yt-cmact">' + YTI.up + (clampInt(s.commentLikes) > 0 ? '<span>' + compact(s.commentLikes) + '</span>' : '') + '<span class="yt-down">' + YTI.up + '</span></div></div></div>'
            : '';
          var add = '<div class="yt-add"><img class="yt-av" src="' + esc(avatar) + '" alt=""><span>Add a comment\u2026</span></div>';

          return open +
            player +
            '<div class="yt-watch">' +
              '<div class="yt-wtitle">' + esc(s.title) + '</div>' +
              '<div class="yt-crow2">' +
                '<img class="yt-av" style="width:40px;height:40px" src="' + esc(avatar) + '" alt="">' +
                '<div class="yt-who"><div class="yt-chn"><span>' + esc(s.channel) + '</span>' + badge + '</div>' +
                (s.subscribers ? '<div class="yt-subs">' + esc(s.subscribers) + '</div>' : '') + '</div>' +
                (s.subscribed
                  ? '<span class="yt-btn yt-btn--on">' + YTI.bell + 'Subscribed</span>'
                  : '<span class="yt-btn">Subscribe</span>') +
              '</div>' +
              '<div class="yt-pills">' +
                '<span class="yt-pill yt-pill--split"><span>' + YTI.up + compact(s.likes) + '</span><i></i><span class="yt-down">' + YTI.up + '</span></span>' +
                '<span class="yt-pill">' + YTI.share + 'Share</span>' +
              '</div>' +
              desc + cmHead + cm + add +
            '</div></article>';
        }
      };

      /* Platforms still to build. Shown disabled in the tab strip. */
      var UPCOMING = [];

      /* ======================================================
         STATE
         ====================================================== */
      var STORE_KEY = 'postbench:v1';
      var current = 'linkedin';
      var state = {};
      var syncers = [];
      var visibles = [];

      function cloneDefaults(id) {
        return JSON.parse(JSON.stringify(PLATFORMS[id].defaults));
      }

      function loadState() {
        Object.keys(PLATFORMS).forEach(function (id) {
          state[id] = cloneDefaults(id);
        });
        try {
          var saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
          Object.keys(saved).forEach(function (id) {
            if (!state[id]) return;
            Object.keys(state[id]).forEach(function (k) {
              if (saved[id] && saved[id][k] !== undefined && typeof saved[id][k] === typeof state[id][k]) {
                state[id][k] = saved[id][k];
              }
            });
          });
        } catch (e) { /* storage unavailable or corrupt: use defaults */ }
      }

      var saveTimer;
      function queueSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
          try {
            localStorage.setItem(STORE_KEY, JSON.stringify(state));
          } catch (e) { /* quota or blocked: ignore */ }
        }, 300);
      }

      function set(key, val) {
        state[current][key] = val;
        renderPreview();
        applyVisibility();
      }

      /* ======================================================
         CONTROLS (generated from each platform's schema)
         ====================================================== */
      function buildField(f) {
        var s = function () { return state[current]; };
        var root = h('div', { class: 'field' });
        var sync = function () {};

        if (f.type === 'text' || f.type === 'number' || f.type === 'textarea') {
          var input = f.type === 'textarea'
            ? h('textarea', { rows: f.rows || 4, id: 'f-' + f.key })
            : h('input', { type: f.type === 'number' ? 'number' : 'text', id: 'f-' + f.key, min: f.type === 'number' ? 0 : null, inputmode: f.type === 'number' ? 'numeric' : null });
          input.addEventListener('input', function () {
            set(f.key, f.type === 'number' ? clampInt(input.value) : input.value);
          });
          root.append(h('label', { class: 'lbl', for: 'f-' + f.key, text: f.label }), input);
          sync = function () { input.value = s()[f.key]; };

        } else if (f.type === 'seg') {
          var btns = f.options.map(function (o) {
            return h('button', {
              type: 'button',
              'data-v': o[0],
              text: o[1],
              onclick: function () { set(f.key, o[0]); syncAll(); }
            });
          });
          root.append(h('div', { class: 'lbl', text: f.label }), h('div', { class: 'seg', role: 'group', 'aria-label': f.label }, btns));
          sync = function () {
            btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === s()[f.key])); });
          };

        } else if (f.type === 'toggle') {
          var cb = h('input', { type: 'checkbox', role: 'switch', onchange: function () { set(f.key, cb.checked); } });
          root.append(h('label', { class: 'switch-row' }, h('span', { text: f.label }), cb, h('span', { class: 'switch' })));
          sync = function () { cb.checked = !!s()[f.key]; };

        } else if (f.type === 'range') {
          var out = h('span');
          var rng = h('input', { type: 'range', min: f.min, max: f.max, step: f.step, id: 'f-' + f.key });
          rng.addEventListener('input', function () {
            out.textContent = rng.value + f.unit;
            set(f.key, Number(rng.value));
          });
          root.append(h('label', { class: 'lbl', for: 'f-' + f.key }, h('span', { text: f.label }), out), rng);
          sync = function () { rng.value = s()[f.key]; out.textContent = rng.value + f.unit; };

        } else if (f.type === 'image') {
          var file = h('input', { type: 'file', accept: 'image/*,video/*', hidden: true });
          var thumb = h('div', { class: 'img-thumb', 'aria-hidden': 'true' });
          var buttons = [
            h('button', { type: 'button', class: 'btn', text: 'Upload', onclick: function () { file.click(); } }),
            h('button', { type: 'button', class: 'btn', text: 'Remove', onclick: function () { set(f.key, ''); syncAll(); } })
          ];
          if (f.sample) {
            buttons.push(h('button', { type: 'button', class: 'btn', text: 'Sample', onclick: function () { set(f.key, SAMPLE_ART); syncAll(); } }));
          }
          file.addEventListener('change', function () {
            var picked = file.files && file.files[0];
            file.value = '';
            if (!picked) return;
            readImage(picked, { max: f.max, square: !!f.square }).then(function (url) {
              set(f.key, url);
              syncAll();
            }).catch(function (err) { toast(err.message); });
          });
          root.append(h('div', { class: 'lbl', text: f.label }), h('div', { class: 'img-field' }, thumb, h('div', { class: 'btn-row' }, buttons), file));
          sync = function () {
            var v = s()[f.key];
            if (!v && f.key === 'avatar') v = initialsAvatar(s().name || 'Name');
            thumb.style.backgroundImage = v ? 'url("' + v.replace(/"/g, '%22') + '")' : 'none';
          };

        } else if (f.type === 'reactions') {
          var chips = Object.keys(REACTIONS).map(function (id) {
            return h('button', {
              type: 'button',
              class: 'rx-chip',
              'data-id': id,
              html: reactionSvg(id) + '<span>' + REACTIONS[id].label + '</span>',
              onclick: function () {
                var list = s()[f.key].slice();
                var at = list.indexOf(id);
                if (at > -1) { if (list.length > 1) list.splice(at, 1); }
                else { list.push(id); if (list.length > 3) list.shift(); }
                set(f.key, list);
                syncAll();
              }
            });
          });
          root.append(h('div', { class: 'lbl', text: f.label }), h('div', { class: 'rx-picker' }, chips));
          sync = function () {
            chips.forEach(function (c) { c.setAttribute('aria-pressed', String(s()[f.key].indexOf(c.getAttribute('data-id')) > -1)); });
          };

        } else if (f.type === 'posts') {
          var list = h('div', { class: 'posts' });
          var open = { 0: true };
          var pickIdx = 0;
          var pick = h('input', { type: 'file', accept: 'image/*,video/*', multiple: true, hidden: true });

          var rebuild = function () {
            list.innerHTML = '';
            var arr = s()[f.key];
            arr.forEach(function (post, i) {
              var thumbs = h('div', { class: 'thumbs' }, post.images.map(function (src, j) {
                var t = h('div', { class: 'thumb' }, h('button', {
                  type: 'button',
                  'aria-label': 'Remove image ' + (j + 1),
                  text: '\u00d7',
                  onclick: function () {
                    post.images.splice(j, 1);
                    set(f.key, arr);
                    rebuild();
                  }
                }));
                t.style.backgroundImage = 'url("' + src.replace(/"/g, '%22') + '")';
                return t;
              }));

              var addImg = h('button', {
                type: 'button',
                class: 'btn',
                text: 'Add images (' + post.images.length + '/4)',
                disabled: post.images.length >= 4,
                onclick: function () { pickIdx = i; pick.click(); }
              });

              var ta = h('textarea', { rows: 3, 'aria-label': 'Text of post ' + (i + 1) });
              ta.value = post.text;
              ta.addEventListener('input', function () {
                post.text = ta.value;
                set(f.key, arr);
              });

              var stats = h('div', { class: 'stat-grid' }, [['replies', 'Replies'], ['reposts', 'Reposts'], ['likes', 'Likes'], ['views', 'Views']].map(function (m) {
                var inp = h('input', { type: 'number', min: 0, inputmode: 'numeric' });
                inp.value = post[m[0]];
                inp.addEventListener('input', function () {
                  post[m[0]] = clampInt(inp.value);
                  set(f.key, arr);
                });
                return h('label', null, m[1], inp);
              }));

              var head = [h('span', { text: i === 0 ? 'Main post' : 'Thread post ' + i })];
              if (i > 0) {
                head.push(h('button', {
                  type: 'button',
                  class: 'post-rm',
                  text: 'Remove',
                  onclick: function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    set(f.key, arr.filter(function (_, k) { return k !== i; }));
                    open = { 0: true };
                    rebuild();
                  }
                }));
              }

              var det = h('details', { class: 'post-item', open: !!open[i] },
                h('summary', null, head),
                h('div', { class: 'post-item-body' }, ta, thumbs, h('div', { class: 'btn-row' }, addImg), stats)
              );
              det.addEventListener('toggle', function () { open[i] = det.open; });
              list.append(det);
            });
          };

          pick.addEventListener('change', function () {
            var files = Array.prototype.slice.call(pick.files || []);
            pick.value = '';
            var arr = s()[f.key];
            var post = arr[pickIdx];
            if (!post || !files.length) return;
            var room = 4 - post.images.length;
            if (files.length > room) toast('Only ' + room + ' more image' + (room === 1 ? '' : 's') + ' fit on one post.');
            Promise.all(files.slice(0, room).map(function (file) {
              return readImage(file, { max: 1600, square: false });
            })).then(function (urls) {
              post.images = post.images.concat(urls);
              open[pickIdx] = true;
              set(f.key, arr);
              rebuild();
            }).catch(function (err) { toast(err.message); });
          });

          var addPost = h('button', {
            type: 'button',
            class: 'btn',
            text: 'Add thread post',
            onclick: function () {
              var arr = s()[f.key].slice();
              if (arr.length >= 10) { toast('Threads are limited to 10 posts here.'); return; }
              arr.push({ text: '', images: [], replies: 0, reposts: 0, likes: 0, views: 0 });
              open[arr.length - 1] = true;
              set(f.key, arr);
              rebuild();
            }
          });

          root.append(h('div', { class: 'lbl', text: f.label }), list, h('div', { class: 'btn-row' }, addPost), pick);
          sync = rebuild;

        } else if (f.type === 'images') {
          var strip = h('div', { class: 'thumbs' });
          var pickAll = h('input', { type: 'file', accept: 'image/*,video/*', multiple: true, hidden: true });
          var addAll = h('button', { type: 'button', class: 'btn', onclick: function () { pickAll.click(); } });

          var paint = function () {
            var arr = s()[f.key];
            strip.innerHTML = '';
            arr.forEach(function (src, j) {
              var t = h('div', { class: 'thumb' }, h('button', {
                type: 'button',
                'aria-label': 'Remove image ' + (j + 1),
                text: '\u00d7',
                onclick: function () {
                  var next = s()[f.key].slice();
                  next.splice(j, 1);
                  set(f.key, next);
                  paint();
                }
              }));
              t.style.backgroundImage = 'url("' + src.replace(/"/g, '%22') + '")';
              strip.append(t);
            });
            addAll.textContent = 'Add images (' + arr.length + '/' + f.maxCount + ')';
            addAll.disabled = arr.length >= f.maxCount;
          };

          pickAll.addEventListener('change', function () {
            var files = Array.prototype.slice.call(pickAll.files || []);
            pickAll.value = '';
            var room = f.maxCount - s()[f.key].length;
            if (!files.length || room <= 0) return;
            if (files.length > room) toast('Only ' + room + ' more image' + (room === 1 ? '' : 's') + ' fit.');
            Promise.all(files.slice(0, room).map(function (file) {
              return readImage(file, { max: 1600, square: false });
            })).then(function (urls) {
              set(f.key, s()[f.key].concat(urls));
              paint();
            }).catch(function (err) { toast(err.message); });
          });

          root.append(h('div', { class: 'lbl', text: f.label }), strip, h('div', { class: 'btn-row' }, addAll), pickAll);
          sync = paint;

        } else if (f.type === 'messages') {
          var mlist = h('div', { class: 'posts' });
          var mopen = { 0: true };
          var mIdx = 0;
          var mfile = h('input', { type: 'file', accept: 'image/*,video/*', hidden: true });

          var mseg = function (opts, get, pick) {
            var wrap = h('div', { class: 'seg', role: 'group' });
            var paintSeg = function () {
              Array.prototype.forEach.call(wrap.children, function (b) {
                b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === get()));
              });
            };
            opts.forEach(function (o) {
              wrap.append(h('button', { type: 'button', 'data-v': o[0], text: o[1], onclick: function () { pick(o[0]); paintSeg(); } }));
            });
            paintSeg();
            return wrap;
          };

          var mlabel = function (m, i) {
            var snip = (m.text || (m.image ? 'Photo' : '')).replace(/\s+/g, ' ').slice(0, 22);
            return (i + 1) + '. ' + (m.dir === 'out' ? 'Sent' : 'Received') + (snip ? ': ' + snip : '');
          };

          var mbuild = function () {
            mlist.innerHTML = '';
            var arr = s()[f.key];
            arr.forEach(function (m, i) {
              var upd = function () { set(f.key, arr); };
              var title = h('span', { text: mlabel(m, i) });

              var dirSeg = mseg([['in', 'Received'], ['out', 'Sent']], function () { return m.dir; }, function (v) {
                m.dir = v;
                title.textContent = mlabel(m, i);
                upd();
              });

              var ta = h('textarea', { rows: 3, 'aria-label': 'Message ' + (i + 1) });
              ta.value = m.text;
              ta.addEventListener('input', function () {
                m.text = ta.value;
                title.textContent = mlabel(m, i);
                upd();
              });

              var tickSeg = mseg([['none', 'None'], ['sent', 'Sent'], ['delivered', 'Delivered'], ['read', 'Read']], function () { return m.status; }, function (v) {
                m.status = v;
                upd();
              });

              var grid = h('div', { class: 'stat-grid' }, [
                ['time', 'Time'], ['sender', 'Sender (groups)'], ['replyName', 'Reply to: name'],
                ['replyText', 'Reply to: text'], ['reaction', 'Reaction emoji'], ['divider', 'Date label above']
              ].map(function (pair) {
                var inp = h('input', { type: 'text' });
                inp.value = m[pair[0]];
                inp.addEventListener('input', function () { m[pair[0]] = inp.value; upd(); });
                return h('label', null, pair[1], inp);
              }));

              var pic = h('div', { class: 'thumbs' });
              if (m.image) {
                var t = h('div', { class: 'thumb' }, h('button', {
                  type: 'button',
                  'aria-label': 'Remove image',
                  text: '\u00d7',
                  onclick: function () { m.image = ''; upd(); mbuild(); }
                }));
                t.style.backgroundImage = 'url("' + m.image.replace(/"/g, '%22') + '")';
                pic.append(t);
              }

              var move = function (by) {
                var next = s()[f.key].slice();
                var to = i + by;
                if (to < 0 || to >= next.length) return;
                next.splice(to, 0, next.splice(i, 1)[0]);
                set(f.key, next);
                mopen = {};
                mopen[to] = true;
                mbuild();
              };

              var tools = h('div', { class: 'btn-row' },
                h('button', { type: 'button', class: 'btn', text: m.image ? 'Replace image' : 'Add image', onclick: function () { mIdx = i; mfile.click(); } }),
                h('button', { type: 'button', class: 'btn', text: 'Move up', disabled: i === 0, onclick: function () { move(-1); } }),
                h('button', { type: 'button', class: 'btn', text: 'Move down', disabled: i === arr.length - 1, onclick: function () { move(1); } })
              );

              var head = [title];
              if (arr.length > 1) {
                head.push(h('button', {
                  type: 'button',
                  class: 'post-rm',
                  text: 'Remove',
                  onclick: function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    set(f.key, arr.filter(function (_, k) { return k !== i; }));
                    mopen = { 0: true };
                    mbuild();
                  }
                }));
              }

              var det = h('details', { class: 'post-item', open: !!mopen[i] },
                h('summary', null, head),
                h('div', { class: 'post-item-body' }, dirSeg, ta, h('div', { class: 'lbl', text: 'Delivery ticks (sent messages)' }), tickSeg, grid, pic, tools)
              );
              det.addEventListener('toggle', function () { mopen[i] = det.open; });
              mlist.append(det);
            });
          };

          mfile.addEventListener('change', function () {
            var picked = mfile.files && mfile.files[0];
            mfile.value = '';
            if (!picked) return;
            readImage(picked, { max: 1200, square: false }).then(function (url) {
              var arr = s()[f.key];
              if (!arr[mIdx]) return;
              arr[mIdx].image = url;
              mopen[mIdx] = true;
              set(f.key, arr);
              mbuild();
            }).catch(function (err) { toast(err.message); });
          });

          var addMsg = function (dir) {
            var arr = s()[f.key].slice();
            if (arr.length >= 30) { toast('Chats are limited to 30 messages here.'); return; }
            var last = arr[arr.length - 1];
            arr.push({ dir: dir, text: '', time: last ? last.time : '09:46', status: 'read', image: '', sender: '', replyName: '', replyText: '', reaction: '', divider: '' });
            mopen = {};
            mopen[arr.length - 1] = true;
            set(f.key, arr);
            mbuild();
          };

          root.append(
            h('div', { class: 'lbl', text: f.label }),
            mlist,
            h('div', { class: 'btn-row' },
              h('button', { type: 'button', class: 'btn', text: 'Add received', onclick: function () { addMsg('in'); } }),
              h('button', { type: 'button', class: 'btn', text: 'Add sent', onclick: function () { addMsg('out'); } })
            ),
            mfile
          );
          sync = mbuild;

        } else if (f.type === 'multi') {
          var mchips = f.options.map(function (o) {
            return h('button', {
              type: 'button',
              class: 'rx-chip',
              'data-id': o[0],
              text: o[1],
              onclick: function () {
                var list = s()[f.key].slice();
                var at = list.indexOf(o[0]);
                if (at > -1) { if (list.length > 1) list.splice(at, 1); }
                else { list.push(o[0]); if (list.length > f.max) list.shift(); }
                set(f.key, list);
                syncAll();
              }
            });
          });
          root.append(h('div', { class: 'lbl', text: f.label }), h('div', { class: 'rx-picker' }, mchips));
          sync = function () {
            mchips.forEach(function (c) {
              c.setAttribute('aria-pressed', String(s()[f.key].indexOf(c.getAttribute('data-id')) > -1));
            });
          };

        } else if (f.type === 'videolook') {
          var vrows = h('div', { class: 'vrows' });
          var lenInp = h('input', { type: 'text', 'aria-label': 'Video length' });
          lenInp.value = VIDEO.len;
          lenInp.addEventListener('input', function () {
            VIDEO.len = lenInp.value;
            renderPreview();
          });

          var vpaint = function () {
            var items = PLATFORMS[current].media ? PLATFORMS[current].media() : [];
            var sig = items.map(function (it) { return it.label; }).join('|');
            if (vrows.getAttribute('data-sig') === sig && items.length) {
              Array.prototype.forEach.call(vrows.querySelectorAll('input'), function (cb, i) {
                cb.checked = isVid(items[i].src);
              });
            } else {
              vrows.setAttribute('data-sig', sig);
              vrows.innerHTML = '';
              if (!items.length) vrows.append(h('div', { class: 'vnone', text: 'Add a photo first.' }));
              items.forEach(function (it, idx) {
                var cb = h('input', { type: 'checkbox', role: 'switch' });
                cb.checked = isVid(it.src);
                cb.addEventListener('change', function () {
                  var now = PLATFORMS[current].media()[idx];
                  if (now) now.write(setVid(now.src, cb.checked));
                });
                vrows.append(h('label', { class: 'switch-row' }, h('span', { text: it.label }), cb, h('span', { class: 'switch' })));
              });
            }
            if (document.activeElement !== lenInp) lenInp.value = VIDEO.len;
          };

          root.append(
            h('div', { class: 'lbl', text: f.label }),
            vrows,
            h('div', { class: 'lbl', text: 'Video length' }),
            lenInp
          );
          videoRows.push({ root: root, paint: vpaint });
          sync = vpaint;

        } else if (f.type === 'swatches') {
          var sws = BACKDROPS.map(function (b) {
            var btn = h('button', {
              type: 'button',
              class: 'sw' + (b.cls ? ' ' + b.cls : ''),
              title: b.label,
              'aria-label': b.label,
              'data-v': b.v,
              onclick: function () { set(f.key, b.v); syncAll(); }
            });
            if (!b.cls) btn.style.background = b.v;
            return btn;
          });
          var custom = h('input', { type: 'color', value: '#ff5a2c', 'aria-label': 'Custom backdrop color' });
          custom.addEventListener('input', function () { set(f.key, custom.value); syncAll(); });
          var customWrap = h('span', { class: 'sw sw--custom', title: 'Custom color' }, custom);
          root.append(h('div', { class: 'lbl', text: f.label }), h('div', { class: 'swatches' }, sws, customWrap));
          sync = function () {
            var v = s()[f.key];
            var known = false;
            sws.forEach(function (b) {
              var on = b.getAttribute('data-v') === v;
              if (on) known = true;
              b.setAttribute('aria-pressed', String(on));
            });
            customWrap.setAttribute('aria-pressed', String(!known));
            if (!known && /^#[0-9a-f]{6}$/i.test(v)) custom.value = v;
          };
        }

        syncers.push(sync);
        if (f.showIf) visibles.push({ el: root, test: f.showIf });
        return root;
      }

      function buildControls() {
        var host = $('#controls');
        host.innerHTML = '';
        syncers = [];
        visibles = [];
        PLATFORMS[current].sections.concat(videoSection(current)).forEach(function (sec) {
          var body = h('div', { class: 'sec-body' }, sec.fields.map(buildField));
          host.append(h('details', { class: 'sec', open: !!sec.open }, h('summary', { text: sec.title }), body));
        });
        syncAll();
      }

      function syncAll() {
        syncers.forEach(function (fn) { fn(); });
        applyVisibility();
      }

      function applyVisibility() {
        visibles.forEach(function (v) { v.el.hidden = !v.test(state[current]); });
      }

      /* ======================================================
         PREVIEW
         ====================================================== */
      var frame = $('#frame');
      var card = $('#card');
      var scaler = $('#scaler');
      var fitBox = $('#fit');
      var stage = $('#stage');

      function renderPreview() {
        var p = PLATFORMS[current];
        var s = state[current];
        card.innerHTML = p.render(s);
        placeVideoOverlays();
        refreshVideoRows();
        frame.style.padding = s.padding + 'px';
        frame.style.background = s.backdrop === 'none' ? 'transparent' : s.backdrop;
        frame.style.setProperty('--card-w', (p.widths || WIDTHS)[s.width] + 'px');
        $('#chipTop').textContent = p.postName + ', ' + WIDTH_NAMES[s.width] + ' width';
        fit();
        queueSave();
      }

      function fit() {
        var cs = getComputedStyle(stage);
        var avail = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        var w = frame.offsetWidth;
        var hgt = frame.offsetHeight;
        if (!w) return;
        var k = Math.min(1, avail / w);
        scaler.style.transform = k < 1 ? 'scale(' + k + ')' : 'none';
        fitBox.style.width = w * k + 'px';
        fitBox.style.height = hgt * k + 'px';
        var transparent = state[current].backdrop === 'none';
        $('#chipBottom').textContent = 'PNG ' + (w * 2) + ' \u00d7 ' + (hgt * 2) + (transparent ? ', transparent' : '');
      }

      function settle() {
        card.classList.remove('settle');
        void card.offsetWidth;
        card.classList.add('settle');
      }

      card.addEventListener('animationend', function () { card.classList.remove('settle'); });

      if (window.ResizeObserver) {
        var ro = new ResizeObserver(fit);
        ro.observe(stage);
        ro.observe(frame);
      } else {
        window.addEventListener('resize', fit);
      }

      /* images inside the card change its height after load */
      card.addEventListener('load', function () {
        placeVideoOverlays();
        fit();
      }, true);

      /* ======================================================
         EXPORT
         ====================================================== */
      function capture() {
        if (!window.html2canvas) {
          return Promise.reject(new Error('The export library did not load. Check your connection and reload.'));
        }
        var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
        return fontsReady.then(function () {
          return window.html2canvas(frame, {
            scale: 2,
            backgroundColor: null,
            useCORS: true,
            logging: false,
            onclone: function (doc) {
              var sc = doc.getElementById('scaler');
              var fb = doc.getElementById('fit');
              var cd = doc.getElementById('card');
              sc.style.transform = 'none';
              fb.style.width = 'auto';
              fb.style.height = 'auto';
              cd.classList.remove('settle');
            }
          });
        });
      }

      function fileName() {
        return PLATFORMS[current].id + '-post.png';
      }

      function withBusy(btn, label, fn) {
        var old = btn.textContent;
        btn.disabled = true;
        btn.textContent = label;
        return fn().then(function (msg) {
          if (msg) toast(msg);
        }).catch(function (err) {
          toast(err.message || 'Export failed.');
        }).then(function () {
          btn.disabled = false;
          btn.textContent = old;
        });
      }

      $('#dlBtn').addEventListener('click', function () {
        withBusy(this, 'Rendering', function () {
          return capture().then(function (canvas) {
            return new Promise(function (resolve, reject) {
              canvas.toBlob(function (blob) {
                if (!blob) return reject(new Error('Could not create the image.'));
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = fileName();
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
                resolve('Downloaded ' + fileName());
              }, 'image/png');
            });
          });
        });
      });

      $('#copyBtn').addEventListener('click', function () {
        withBusy(this, 'Rendering', function () {
          if (!navigator.clipboard || !window.ClipboardItem) {
            return Promise.reject(new Error('This browser cannot copy images. Use Download PNG.'));
          }
          return capture().then(function (canvas) {
            return new Promise(function (resolve, reject) {
              canvas.toBlob(function (blob) {
                if (!blob) return reject(new Error('Could not create the image.'));
                navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
                  resolve('Image copied');
                }).catch(function () {
                  reject(new Error('Copy was blocked. Use Download PNG.'));
                });
              }, 'image/png');
            });
          });
        });
      });

      /* ======================================================
         CHROME: tabs, reset, app theme
         ====================================================== */
      function buildTabs() {
        var nav = $('#tabs');
        nav.innerHTML = '';
        Object.keys(PLATFORMS).forEach(function (id) {
          nav.append(h('button', {
            type: 'button',
            class: 'tab',
            text: PLATFORMS[id].label,
            'aria-current': String(id === current),
            onclick: function () { switchTo(id); }
          }));
        });
        UPCOMING.forEach(function (name) {
          nav.append(h('button', { type: 'button', class: 'tab', disabled: true, title: 'Planned for a later build' }, name, h('small', { text: 'next' })));
        });
      }

      function switchTo(id) {
        current = id;
        buildTabs();
        buildControls();
        renderPreview();
        settle();
      }

      $('#resetBtn').addEventListener('click', function () {
        state[current] = cloneDefaults(current);
        syncAll();
        renderPreview();
        settle();
        toast('Reset to the sample post');
      });

      var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400"/></svg>';
      var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.500A8 8 0 019.500 4 8 8 0 1020 14.500z"/></svg>';

      function appIsDark() {
        var t = document.documentElement.getAttribute('data-theme');
        if (t) return t === 'dark';
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      function paintThemeBtn() {
        $('#themeBtn').innerHTML = appIsDark() ? SUN : MOON;
      }

      $('#themeBtn').addEventListener('click', function () {
        var next = appIsDark() ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('postbench:app-theme', next); } catch (e) { /* ignore */ }
        paintThemeBtn();
      });

      try {
        var savedTheme = localStorage.getItem('postbench:app-theme');
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
      } catch (e) { /* ignore */ }
      paintThemeBtn();

      /* ======================================================
         BOOT
         ====================================================== */
      loadState();
      switchTo(current);
      window.addEventListener('load', fit);
    })();
  </script>
</body>
</html>
